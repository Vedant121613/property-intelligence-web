services:
  # ========================================================
  # Pureframe Full-Stack Application (React SPA + Express API)
  # ========================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pureframe-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pureframe_db}
      - SINGLE_USER_NAME=${SINGLE_USER_NAME:-user@123}
      - SINGLE_USER_PASS=${SINGLE_USER_PASS:-pass@123}
      - MSG91_AUTH_KEY=${MSG91_AUTH_KEY:-}
      - MSG91_WIDGET_ID=${MSG91_WIDGET_ID:-}
    depends_on:
      db:
        condition: service_healthy

  # ========================================================
  # PostgreSQL Database Service
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: pureframe-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pureframe_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pureframe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: pureframe_pgdata
